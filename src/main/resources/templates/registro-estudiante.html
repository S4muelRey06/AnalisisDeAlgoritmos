<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crear estudiante</title><link rel="stylesheet" href="/academico.css?v=3"></head>
<body><header class="app-header"><nav aria-label="Navegación principal"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">▦</span>Horarios<span class="brand-detail">académicos</span></a><a class="nav-link" href="/funcionario/clases">Importar clases <span aria-hidden="true">↗</span></a></nav></header><main class="compact-page">
<a class="back-link" href="/">← Estudiantes</a>
<h1>Crear estudiante</h1>
<p>Registra tus datos para preparar tu horario.</p>
<form method="post" th:object="${registro}" class="registration-form">
<label for="nombre">Nombre completo</label>
<input id="nombre" type="text" th:field="*{nombre}" autocomplete="name" required maxlength="100">
<p class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
<label for="correo">Correo electrónico</label>
<input id="correo" type="email" th:field="*{correo}" autocomplete="email" required maxlength="120">
<p class="field-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
<label for="promedio">Promedio actual</label>
<input id="promedio" type="number" th:field="*{promedio}" required min="0" max="5" step="any">
<p class="field-error" th:if="${#fields.hasErrors('promedio')}" th:errors="*{promedio}"></p>
<button>Crear y preparar horario →</button>
</form></main></body></html>
