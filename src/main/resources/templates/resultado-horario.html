<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horario generado</title><link rel="stylesheet" href="/academico.css?v=3"></head><body><header class="app-header"><nav aria-label="Navegación principal"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">▦</span>Horarios<span class="brand-detail">académicos</span></a><a class="nav-link" href="/funcionario/clases">Importar clases <span aria-hidden="true">↗</span></a></nav></header><main class="result-page">
<a class="back-link" href="/">← Estudiantes</a><h1 th:text="|Horario de ${estudiante.nombre}|"></h1>
<div class="week-grid"><section class="day-card" th:each="dia : ${resultado.horario}"><h2 th:text="${dia.key}"></h2><p th:if="${dia.value.empty}">Sin clases</p><article class="class-card" th:each="s : ${dia.value}"><strong th:text="${s.materia}"></strong> <span th:text="|${s.horario.hora_inicio}–${s.horario.hora_fin}|"></span><p th:text="|Grupo ${s.numero_de_clase} · ${s.profesor.nombre} · Edificio ${s.lugar.numero_edificio}, salón ${s.lugar.numero_salon}|"></p></article></section>
</div><section class="notice warning" th:unless="${resultado.no_asignadas.isEmpty()}"><h2>Materias no asignadas</h2><p th:each="m : ${resultado.no_asignadas}" th:text="|${m.materia}: ${m.motivo}|"></p></section>
<section class="notice warning" th:unless="${resultado.fuera_de_franja.isEmpty()}"><h2>Fuera de la franja preferida</h2><p th:each="a : ${resultado.fuera_de_franja}" th:text="|${a.materia} · grupo ${a.numero_de_clase}|"></p></section>
<section class="notice" th:unless="${resultado.avisos.isEmpty()}"><h2>Otras preferencias incumplidas</h2><p th:each="aviso : ${resultado.avisos}" th:text="${aviso}"></p></section>
<form class="confirmation-action" th:if="${confirmable}" method="post" th:action="@{/estudiantes/{id}/horario/confirmar(id=${estudiante.id})}"><input type="hidden" name="firma" th:value="${firma}"><button>Confirmar horario</button></form>
<a th:href="@{/estudiantes/{id}/horario/guardado(id=${estudiante.id})}">Consultar JSON guardado</a> · <a th:href="@{/estudiantes/{id}/horario(id=${estudiante.id})}">Preparar otra propuesta</a></main></body></html>
